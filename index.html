<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LEGENDS OF DRAGONS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
<style>
  body {
    margin:0;
    padding:0;
    background:#000;
    color:#fff;
    font-family:'MedievalSharp', cursive;
    text-align:center;
  }
  canvas {
    display:block;
    margin:0 auto;
    border:2px solid #666;
  }
  #savebar {
    position:absolute;
    top:10px;
    right:20px;
    z-index:999;
  }
  #savebar button {
    font-family:'MedievalSharp', cursive;
    font-size:16px;
    margin-left:5px;
    padding:6px 12px;
    background:#333;
    color:#fff;
    border:1px solid #666;
    border-radius:6px;
    cursor:pointer;
  }
  #savebar button:hover {
    background:#555;
    color:#ffd700;
  }
/* 🔧 Mueve el canvas del juego más arriba */
canvas {
  position: relative;
  top: -30px; /* 🔹 prueba con -40, ajusta a gusto (-60, -80, etc.) */
}

</style>
</head>
<body>
  <h1>LEGENDS OF DRAGONS</h1>

<!-- 📅 Calendario -->
<div id="calendarDisplay" style="
  position:absolute;
  top:50px;              /* 👈 Ajusta la distancia desde arriba (20–50px según necesites) */
  left:50%;
  transform:translateX(-50%); /* centra horizontalmente */
  font-family:'MedievalSharp', cursive;
  font-size:17px;
  background:#222;
  border:1px solid #666;
  border-radius:8px;
  padding:6px 14px;
  color:#ffd700;
  min-width:200px;
  text-align:center;
  letter-spacing:0.5px;
  z-index:1000;          /* 👈 asegura que esté por encima del canvas */
">
📅 Mes 1 · Día 1 (🌸 Brotix)
</div>
<!-- 🧭 Modo Historia -->
<div id="storyHUD" style="
  position:absolute;
  top:50%;
  right:40px;
  transform:translateY(-50%);
  width:300px;
  background:#111a;
  border:2px solid #888;
  border-radius:12px;
  padding:12px 16px;
  color:#fff;
  font-family:'Cinzel Decorative', serif;
  font-size:16px;
  text-align:left;
  z-index:2000;
  display:none;
  box-shadow:0 0 10px #000;
">
  <div id="storyTitle" style="font-size:18px; font-weight:bold; color:#ffd700; text-align:center;">MODO HISTORIA</div>
  <hr style="border:1px solid #555; margin:8px 0;">
  <div id="storyText" style="margin-top:6px; line-height:1.3;">Misión actual: —</div>
  <button id="storyButton" style="
    margin-top:10px;
    background:#333;
    color:#ffd700;
    border:1px solid #888;
    border-radius:6px;
    padding:6px 14px;
    cursor:pointer;
    display:block;
    width:100%;
    font-family:'MedievalSharp', cursive;
  ">Completar</button>
</div>

 <div id="savebar">
  <button onclick="SaveGame.save()">💾 Guardar</button>
  <button onclick="document.getElementById('fileInput').click()">📂 Cargar</button>
  <input type="file" id="fileInput" style="display:none" onchange="SaveGame.loadFromFile(this.files[0])">
  <button onclick="SaveGame.encodeToCode()">💠 Código</button>
  <button onclick="SaveGame.decodeFromCode()">📜 Cargar código</button>
</div>
<div id="eggCounter" style="
  position:absolute;
  top:100px;              /* 👈 Ajusta la distancia desde arriba (20–50px según necesites) */
   left:50%;
  color:white;
  font-size:18px;
  font-family:'MedievalSharp', cursive;
">
  🥚 0
</div>
 
  <!-- Phaser -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
  <!-- Título -->
  <script src="config/title.js"></script>
  <script src="config/cargarpartida.js"></script>
  <script src="config/storymode.js"></script>
  <!-- Scripts base -->
  <script src="dragocodex/dragones.js"></script>
  <script src="config/init.js"></script>
  <script src="dragocodex/roleplay.js"></script>
  <script src="mapas/hud.js"></script>
  <script src="config/selector.js"></script>
  <script src="dragocodex/chosedragon.js"></script>
  <script src="ciudad/poblado.js"></script>
  <script src="dragocodex/criadero.js"></script>
  <script src="dragocodex/coleccion.js"></script>
  <script src="dragocodex/coleccionpoblado.js"></script>
  <script src="mapas/mapaselector.js"></script>
  <script src="events/eventos.js"></script>
  <script src="events/misionespasivas.js"></script>
  <script src="dragocodex/rareza.js"></script>

  <!-- 🔑 Nuevo gestor de islas persistentes -->
  <script src="mapas/islaworld_runtime.js"></script>
   <!-- 📜 Misiones -->
  <script src="events/misiones.js"></script>

   <!-- ⚙️ Configuración del juego -->
  <script src="config/savegame.js"></script>
  <!-- 📅 Calendario global -->
<script src="config/calendar_runtime.js"></script>
  <!-- 🐉 Sistema clásico de encuentros -->
  <script src="combate/encuentros.js"></script>
  <!-- 🌍 Escenas principales -->
  <script src="mapas/mapa.js"></script>
  <script src="inventario/inventario.js"></script>
  <script src="mapas/mapabotones.js"></script>
  <script src="combate/combatUI.js"></script>

  <!-- 🤖 IA de combate clásico -->
  <script src="combate/IAattack.js"></script>
  <script src="combate/skills.js"></script>
  <script src="combate/combate.js"></script>
  <script src="dragocodex/captura.js"></script>

  <!-- 🏙️ Ciudades -->
  <script src="ciudad/ciudades.js"></script>
  <script src="ciudad/ciudad.js"></script>

  <!-- 📖 Colección global -->
  <script src="dragocodex/dragocodex.js"></script>

 
  <!-- ⚔️ NUEVO SISTEMA TÁCTICO -->
  <script src="tactic/tactics_encounter.js"></script>
  <script src="tactic/tactics_integration.js"></script>
  <script src="tactic/tactics_turns.js"></script>
  <script src="tactic/tactics_IA.js"></script>
  <script src="tactic/tactics_skills.js"></script>
  <script src="tactic/tactics_events.js"></script>

  <!-- 🌍 Mapa del mundo (usa tacticsEvents) -->
  <script src="events/eventoscompletados.js"></script>
  <script src="mapas/world.js"></script>

  <!-- ⚔️ Escena táctica -->
  <script src="tactic/tactics_combate.js"></script>
 
  <script>
  // ==============================
  // CONFIGURACIÓN DEL JUEGO
  // ==============================
  const config = {
    type: Phaser.AUTO,
    width: 1600,
    height: 800,
    backgroundColor: "#000",
    physics: {
      default: "arcade",
      arcade: { debug: false }
    },
    scene: [
      SceneTitle, 
      SceneCargarPartida,  // 👈 nueva escena aquí
      SceneSelector,
      ScenePoblado,
      SceneColeccion,
      SceneColeccionPoblado,
      SceneSeleccionIsla,
      SceneMapa,
      SceneWorld,
      SceneCiudad,
      SceneCriadero,
      SceneInventario,
      SceneChooseDragon,
      SceneCombate,
      SceneCapturaConfirmacion,
      SceneDragocodex,
      SceneTablonMisiones,
      SceneMisionesActivas,
      SceneMisionesPasivas,
      SceneCombateTactico, // ⚔️ NUEVA ESCENA
      SceneEventosCompletados // 👈 Añadida correctamente
    ]
  };

  const game = new Phaser.Game(config);
// ==============================
// INICIALIZACIÓN DE GUARDADO Y CARGA
// ==============================

// 💾 Guardar
document.getElementById("btnSave").onclick = () => SaveGame.save();

// 📂 Cargar desde archivo
document.getElementById("btnLoad").onclick = () =>
  document.getElementById("fileInput").click();

document.getElementById("fileInput").onchange = e => {
  const file = e.target.files[0];
  if (file) SaveGame.loadFromFile(file);
};

window.addEventListener("load", () => {
  if (window.__FROM_SAVEGAME__) {
    console.log("🧩 Arranque bloqueado: ya se está cargando partida (SceneWorld en curso).");
    return;
  }
  console.log("🌟 Nueva partida (sin carga automática)");
  game.scene.start("SceneSelector"); // solo si no venimos de un save
});


</script>

</body>
</html>
